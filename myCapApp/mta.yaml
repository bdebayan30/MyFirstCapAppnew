_schema-version: 3.3.0
ID: myCapApp
version: 1.0.0
description: My first CAP App
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: mycapapp-ui
    type: nodejs
    path: app
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      disk-quota: 1024MB
      memory: 1024MB
    build-parameters:
      builder: npm-ci
    requires:
      - name: myCapApp-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          strictSSL: true
          forwardAuthToken: true
          url: '~{srv-url}'
  - name: myCapApp-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      disk-quota: 1024MB
      memory: 1024MB
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    requires:
      - name: myCapApp-db
      - name: myCapApp-auth
  - name: myCapApp-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 1024MB
      memory: 1024MB
    requires:
      - name: myCapApp-db
resources:
  - name: myCapApp-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: myCapApp-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: 'myCapApp-${org}-${space}'
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
        role-collections:
          - name: 'Viewer (myCapApp ${org}-${space})'
            description: generated
            role-template-references:
              - $XSAPPNAME.Viewer
          - name: 'Editor (myCapApp ${org}-${space})'
            description: generated
            role-template-references:
              - $XSAPPNAME.Editor
          - name: 'userattributes (myCapApp ${org}-${space})'
            description: generated
            role-template-references:
              - $XSAPPNAME.userattributes
